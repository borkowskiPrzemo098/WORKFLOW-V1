<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow — Panel zadań</title>
<style>
  :root{
    --bg:#f4f5f7;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --border:#e3e6eb;
    --ink:#1c2128;
    --ink-soft:#5b6472;
    --ink-faint:#8891a0;
    --accent:#3d5cff;
    --accent-ink:#ffffff;
    --accent-soft:#eef1ff;
    --urgent:#e0433f;
    --urgent-soft:#fdeceb;
    --high:#e08a2b;
    --high-soft:#fdf1e2;
    --mid:#2b8ce0;
    --mid-soft:#e7f2fd;
    --low:#3aa66c;
    --low-soft:#e8f6ee;
    --done:#8891a0;
    --done-soft:#eef0f3;
    --shadow-sm:0 1px 2px rgba(20,24,33,.06);
    --shadow-md:0 6px 20px -4px rgba(20,24,33,.14), 0 2px 6px rgba(20,24,33,.06);
    --shadow-lg:0 24px 60px -12px rgba(20,24,33,.28);
    --radius:14px;
    --radius-sm:9px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  [data-theme="dark"]{
    --bg:#14161c;
    --surface:#1c1f27;
    --surface-2:#20232c;
    --border:#31353f;
    --ink:#eceef2;
    --ink-soft:#a6acb8;
    --ink-faint:#6b7280;
    --accent:#5b7cff;
    --accent-ink:#ffffff;
    --accent-soft:#232a45;
    --urgent:#f2645f;
    --urgent-soft:#3a2226;
    --high:#f0a34e;
    --high-soft:#3a2c19;
    --mid:#4fa3f2;
    --mid-soft:#1c2c3d;
    --low:#4cc384;
    --low-soft:#1a2f24;
    --done:#6b7280;
    --done-soft:#262933;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 6px 20px -4px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --shadow-lg:0 24px 60px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font);
    /* background-color kept separate from background-image: some engines
       fail to repaint a bare var() used as the color layer inside a combined
       `background` shorthand when that variable changes at runtime. */
    background-color:var(--bg);
    background-image:
      radial-gradient(1400px 650px at 100% -10%, color-mix(in srgb, var(--accent-soft) 90%, transparent) 0%, transparent 65%),
      radial-gradient(1000px 500px at -10% 0%, color-mix(in srgb, var(--accent-soft) 55%, transparent) 0%, transparent 60%);
    color:var(--ink);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }

  .wrap{max-width:1320px; margin:0 auto; padding:28px 32px 120px;}

  /* Header */
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; margin-bottom:28px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,#4b6bff,#3d5cff 55%,#2f46d6);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-sm);
    flex-shrink:0;
  }
  .brand-mark svg{width:20px; height:20px;}
  .brand-text h1{font-size:21px; margin:0; font-weight:700; letter-spacing:-0.01em;}
  .brand-text p{margin:1px 0 0; font-size:14px; color:var(--ink-faint);}

  .top-actions{display:flex; align-items:center; gap:10px;}

  .stat-pill{
    display:flex; align-items:center; gap:7px;
    background:var(--surface); border:1px solid var(--border);
    padding:8px 14px; border-radius:999px; font-size:14px;
    color:var(--ink-soft); box-shadow:var(--shadow-sm); font-weight:600;
  }
  .stat-pill b{color:var(--ink); font-weight:700;}
  .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .stat-pill-btn{
    cursor:pointer; font-family:inherit; transition:transform .12s ease, box-shadow .12s ease;
  }
  .stat-pill-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}

  .btn-primary{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:var(--accent-ink);
    border:none; padding:11px 18px; border-radius:11px;
    font-size:14px; font-weight:600; cursor:pointer;
    box-shadow:0 8px 20px -6px rgba(61,92,255,.55);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    font-family:inherit;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 12px 26px -6px rgba(61,92,255,.6); background:#3352f0;}
  .btn-primary:active{transform:translateY(0px) scale(.98);}
  .btn-primary svg{width:16px; height:16px;}

  .theme-toggle{
    width:38px; height:38px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:var(--shadow-sm); transition:all .15s ease;
  }
  .theme-toggle:hover{border-color:var(--accent); color:var(--accent);}
  .theme-toggle svg{width:17px; height:17px;}
  .theme-toggle .sun-icon{display:none;}
  [data-theme="dark"] .theme-toggle .moon-icon{display:none;}
  [data-theme="dark"] .theme-toggle .sun-icon{display:block;}

  .color-picker-wrap{position:relative;}
  .color-popover{
    position:absolute; top:46px; right:0;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:12px; box-shadow:var(--shadow-lg);
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
    opacity:0; transform:translateY(-6px); pointer-events:none;
    transition:opacity .15s ease, transform .15s ease; z-index:60;
  }
  .color-popover.open{opacity:1; transform:translateY(0); pointer-events:auto;}
  .color-swatch{
    width:30px; height:30px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; padding:0; position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .color-swatch.active{border-color:var(--ink);}
  .color-swatch.active::after{
    content:''; position:absolute; inset:0; margin:auto; width:9px; height:9px;
    border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.15);
  }

  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:11px;
    padding:0 12px; height:38px; box-shadow:var(--shadow-sm); width:200px; flex-shrink:0;
  }
  .search-box svg{width:15px; height:15px; color:var(--ink-faint); flex-shrink:0;}
  .search-box input{
    border:none; background:none; outline:none; font-family:inherit; font-size:14px;
    color:var(--ink); width:100%; padding:0;
  }
  .search-box input::placeholder{color:var(--ink-faint);}

  /* View tabs */
  .view-tabs{
    display:flex; align-items:center; gap:6px; margin-bottom:16px; flex-wrap:wrap;
  }
  .view-tab{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    font-size:14px; font-weight:650; padding:8px 14px; border-radius:999px; cursor:pointer;
    font-family:inherit; transition:all .15s ease;
  }
  .view-tab:hover{border-color:var(--accent); color:var(--accent);}
  .view-tab.active{background:var(--ink); border-color:var(--ink); color:var(--surface);}
  [data-theme="dark"] .view-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .view-tab .tab-badge{
    background:var(--urgent); color:#fff; font-size:11px; font-weight:800;
    min-width:17px; height:17px; padding:0 4px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
  }
  .view-tab.active .tab-badge{background:rgba(255,255,255,.28);}

  .flat-view{
    display:flex; flex-direction:column; gap:9px; max-width:640px;
  }
  .recur-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:6px; background:var(--accent-soft); color:var(--accent);
    flex-shrink:0; margin-top:1px;
  }
  .recur-badge svg{width:11px; height:11px;}
  .task.is-overdue{border-color:var(--urgent);}

  /* Month navigation */
  .month-nav{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .month-nav h2{
    font-size:17px; font-weight:750; letter-spacing:-.01em; margin:0;
    min-width:190px; text-transform:capitalize;
  }
  .month-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .month-btn svg{width:15px; height:15px;}
  .month-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .chip-today{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    font-size:14px; font-weight:700; padding:6px 13px; border-radius:999px; cursor:pointer;
    font-family:inherit; transition:all .15s ease; margin-left:2px;
  }
  .chip-today:hover{border-color:var(--accent); color:var(--accent);}

  .weekday-row{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:14px;
    margin-bottom:8px; padding:0 2px;
  }
  .weekday-row span{
    font-size:11px; font-weight:700; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:.03em; text-align:left; padding-left:2px;
  }

  /* Layout: no-date sidebar + calendar */
  .calendar-layout{display:flex; gap:18px; align-items:flex-start;}
  .calendar-main{flex:1; min-width:0;}

  .no-date-panel{
    width:236px; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden;
  }
  .no-date-head{
    padding:12px 14px 10px; display:flex; align-items:center; justify-content:space-between;
    font-size:14px; font-weight:700; color:var(--ink-soft);
  }
  .no-date-list{padding:0 10px 12px; display:flex; flex-direction:column; gap:6px; max-height:min(70vh, 700px); overflow-y:auto;}

  /* Month grid */
  .board{
    display:grid;
    grid-template-columns:repeat(7, minmax(0,1fr));
    gap:14px;
  }
  .board.single{grid-template-columns:1fr; max-width:480px;}
  .board.single .day-col{min-height:0;}
  .board.single .day-body{gap:8px;}

  @media (max-width:900px){
    .board{grid-template-columns:repeat(1, 1fr);}
    .weekday-row{display:none;}
    .calendar-layout{flex-direction:column;}
    .no-date-panel{width:100%;}
    .no-date-list{max-height:none;}
  }

  .day-col{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    display:flex; flex-direction:column;
    min-height:120px;
    overflow:hidden;
  }
  .day-col.outside{opacity:.45;}
  .day-col.today{
    border-color:#c7d0ff;
    background:linear-gradient(180deg,#f4f6ff, var(--surface-2) 90px);
  }
  .day-head{
    padding:10px 12px 8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .day-head .name{font-size:14px; font-weight:700; letter-spacing:-.01em;}
  .day-col.today .day-head .name{color:var(--accent);}
  .day-count{
    font-size:11px; font-weight:700; color:var(--ink-faint);
    background:var(--surface); border:1px solid var(--border);
    min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
  }

  .day-body{padding:0 8px 10px; display:flex; flex-direction:column; gap:6px; flex:1;}

  .empty-day{
    margin:2px 2px 4px; padding:10px 6px;
    color:var(--ink-faint); font-size:11px; text-align:center;
    font-weight:500;
  }

  /* Task card */
  .task{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:9px 10px 8px;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    position:relative;
  }
  .task:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:#d7dbe3;}
  .task.u-pilne{background:linear-gradient(180deg,var(--urgent-soft) 0%, var(--surface) 46px);}
  .task.is-done{opacity:.6;}
  .task.is-done .task-title{text-decoration:line-through; color:var(--ink-faint);}

  .task-top{display:flex; align-items:flex-start; gap:6px;}
  .task-title{
    flex:1; min-width:0; font-size:14px; font-weight:650; line-height:1.35; color:var(--ink);
    word-break:break-word;
    /* Cap long titles at 2 lines instead of letting narrow calendar columns
       (e.g. laptop-width windows) push cards tall with a wall of wrapped text.
       Full title is still available via the tooltip and the edit modal. */
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .task-check{
    flex-shrink:0; width:19px; height:19px; margin-top:1px; border-radius:6px;
    border:1.5px solid var(--border); background:var(--surface); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    color:transparent; transition:all .12s ease;
  }
  .task-check:hover{border-color:var(--low);}
  .task-check svg{width:12px; height:12px; stroke:currentColor;}
  .task.is-done .task-check{background:var(--low); border-color:var(--low); color:#fff;}

  .urg-icon{
    flex-shrink:0; width:20px; height:20px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .urg-icon svg{width:12px; height:12px;}
  .u-pilne .urg-icon{background:var(--urgent-soft); color:var(--urgent);}
  .u-wysoka .urg-icon{background:var(--high-soft); color:var(--high);}
  .u-srednia .urg-icon{background:var(--mid-soft); color:var(--mid);}
  .u-niska .urg-icon{background:var(--low-soft); color:var(--low);}

  .task-time{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:700; color:var(--ink-soft);
    background:var(--surface-2); border:1px solid var(--border);
    padding:3px 7px 3px 6px; border-radius:6px;
  }
  .task-time svg{width:10px; height:10px; flex-shrink:0;}
  .task.is-firing{animation:taskPulse 1s ease-in-out 3;}
  @keyframes taskPulse{
    0%,100%{box-shadow:var(--shadow-sm);}
    50%{box-shadow:0 0 0 3px var(--urgent-soft), var(--shadow-md);}
  }

  .task-meta{display:flex; align-items:center; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .badge{
    font-size:11px; font-weight:700; padding:3px 7px; border-radius:6px;
    letter-spacing:.01em; display:inline-flex; align-items:center; gap:4px;
  }
  .diff-Łatwe{background:var(--low-soft); color:var(--low);}
  .diff-Średnie{background:var(--high-soft); color:var(--high);}
  .diff-Trudne{background:var(--urgent-soft); color:var(--urgent);}

  .status-badge{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border);}
  .status-badge.done{background:var(--low-soft); color:var(--low); border-color:transparent;}
  .status-badge.progress{background:var(--mid-soft); color:var(--mid); border-color:transparent;}

  .task-foot{display:flex; align-items:center; justify-content:flex-end; margin-top:9px; padding-top:8px; border-top:1px dashed var(--border);}
  .task-del{
    background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:3px;
    border-radius:6px; display:flex; opacity:0; transition:opacity .12s ease, color .12s ease, background .12s ease;
  }
  .task:hover .task-del{opacity:1;}
  .task-del:hover{color:var(--urgent); background:var(--urgent-soft);}
  .task-del svg{width:13px; height:13px;}

  /* Empty state (no tasks anywhere) */
  .global-empty{
    text-align:center; padding:70px 20px 40px; color:var(--ink-faint);
  }
  .global-empty svg{width:56px; height:56px; margin-bottom:14px; opacity:.5;}
  .global-empty h3{color:var(--ink); font-size:17px; margin:0 0 6px;}
  .global-empty p{margin:0; font-size:14px;}

  /* FAB */
  .fab{
    position:fixed; right:28px; bottom:28px;
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; cursor:pointer;
    box-shadow:0 14px 30px -8px rgba(61,92,255,.6);
    display:flex; align-items:center; justify-content:center;
    transition:transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s ease;
    z-index:40;
  }
  .fab:hover{transform:scale(1.06) rotate(90deg); box-shadow:0 18px 36px -8px rgba(61,92,255,.7);}
  .fab svg{width:24px; height:24px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(17,20,28,.5);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}

  .modal{
    background:var(--surface); width:100%; max-width:520px;
    border-radius:18px; box-shadow:var(--shadow-lg);
    max-height:90vh; overflow-y:auto;
    transform:translateY(14px) scale(.98); transition:transform .2s cubic-bezier(.2,.9,.3,1);
  }
  .overlay.open .modal{transform:translateY(0) scale(1);}

  .modal-head{
    padding:22px 26px 16px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--surface); z-index:2;
  }
  .modal-head h2{margin:0; font-size:17px; font-weight:750; letter-spacing:-.01em;}
  .modal-close{
    background:var(--surface-2); border:1px solid var(--border); width:30px; height:30px;
    border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .modal-close:hover{background:var(--urgent-soft); color:var(--urgent); border-color:transparent;}
  .modal-close svg{width:15px; height:15px;}

  form{padding:2px 26px 26px; display:flex; flex-direction:column; gap:16px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:14px; font-weight:700; color:var(--ink-soft);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  input[type=text], input[type=date], select, textarea{
    font-family:inherit; font-size:14px; color:var(--ink);
    background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:10px; padding:10px 12px; outline:none;
    transition:border-color .15s ease, background .15s ease;
    width:100%;
  }
  input[type=text]:focus, input[type=date]:focus, select:focus, textarea:focus{
    border-color:var(--accent); background:var(--surface);
  }
  textarea{resize:vertical; min-height:74px; line-height:1.5;}
  select{cursor:pointer; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%235b6472' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:32px;
  }

  .checkbox-row{
    display:flex; align-items:center; gap:8px; margin-top:-6px;
    font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer; user-select:none;
  }
  .checkbox-row input{width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex-shrink:0;}

  .urgency-select{display:flex; gap:8px;}
  .urgency-opt{
    flex:1; text-align:center; padding:9px 4px; border-radius:9px; cursor:pointer;
    border:1.5px solid var(--border); font-size:14px; font-weight:700; color:var(--ink-soft);
    background:var(--surface-2); transition:all .15s ease; user-select:none;
  }
  .urgency-opt.sel-Niska.active{background:var(--low-soft); border-color:var(--low); color:var(--low);}
  .urgency-opt.sel-Średnia.active{background:var(--mid-soft); border-color:var(--mid); color:var(--mid);}
  .urgency-opt.sel-Wysoka.active{background:var(--high-soft); border-color:var(--high); color:var(--high);}
  .urgency-opt.sel-Pilne.active{background:var(--urgent-soft); border-color:var(--urgent); color:var(--urgent);}

  .modal-actions{display:flex; gap:10px; margin-top:4px;}
  .btn-ghost{
    flex:1; background:var(--surface-2); border:1.5px solid var(--border); color:var(--ink-soft);
    padding:11px; border-radius:11px; font-weight:650; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn-ghost:hover{background:var(--border);}
  .btn-submit{
    flex:2; background:var(--accent); border:none; color:#fff;
    padding:11px; border-radius:11px; font-weight:650; font-size:14px; cursor:pointer; font-family:inherit;
    box-shadow:0 8px 20px -6px rgba(61,92,255,.5);
  }
  .btn-submit:hover{background:#3352f0;}

  .urgent-list{
    padding:2px 26px 26px; display:flex; flex-direction:column; gap:9px;
    max-height:65vh; overflow-y:auto;
  }
  .urgent-list .empty-day{padding:24px 6px; font-size:14px;}
  .task-day{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); padding:3px 7px; border-radius:6px;
  }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:11px;
    font-size:14px; font-weight:600; box-shadow:var(--shadow-lg);
    display:flex; align-items:center; gap:8px;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast svg{width:15px; height:15px; color:#3aa66c; flex-shrink:0;}

  @media (max-width:720px){
    .wrap{padding:20px 16px 110px;}
    .board{grid-template-columns:1fr;}
    header.top{align-items:flex-start;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h13" stroke="white" stroke-width="2.3" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <h1>Workflow</h1>
        <p>Panel zadań — cały miesiąc na raz</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Szukaj zadania…">
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" title="Zmień motyw" aria-label="Zmień motyw jasny/ciemny">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.5M12 19v2.5M21.5 12H19M5 12H2.5M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4L5.6 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="color-picker-wrap">
        <button class="theme-toggle" id="colorPickerBtn" type="button" title="Kolor motywu" aria-label="Wybierz kolor motywu">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 000 18c1.4 0 2-1 2-2s-.5-1.3-.5-2 .5-1.2 1.5-1.2H16a4 4 0 004-4c0-4.4-3.6-8.8-8-8.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="7.3" cy="11" r="1.15" fill="currentColor"/><circle cx="9.8" cy="7" r="1.15" fill="currentColor"/><circle cx="14.5" cy="7" r="1.15" fill="currentColor"/><circle cx="16.8" cy="11" r="1.15" fill="currentColor"/></svg>
        </button>
        <div class="color-popover" id="colorPopover"></div>
      </div>
      <div class="stat-pill" id="clockPill" title="Aktualny czas">
        <svg viewBox="0 0 24 24" fill="none" width="13" height="13"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <b id="liveClock">--:--</b>
      </div>
      <button class="stat-pill stat-pill-btn" id="statPilne" type="button" title="Pokaż listę pilnych zadań">
        <span class="dot" style="background:var(--urgent)"></span> <b id="cntPilne">0</b> pilnych
      </button>
      <div class="stat-pill" id="statAll"><span class="dot" style="background:var(--accent)"></span> <b id="cntAll">0</b> zadań</div>
      <button class="btn-primary" id="openAddTop">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        Nowe zadanie
      </button>
    </div>
  </header>

  <div class="view-tabs" id="viewTabs">
    <button class="view-tab" data-view="today" type="button">Dziś</button>
    <button class="view-tab" data-view="week" type="button">Tydzień</button>
    <button class="view-tab" data-view="month" type="button">Miesiąc</button>
    <button class="view-tab" data-view="overdue" type="button">Zaległe <span class="tab-badge" id="overdueBadge" style="display:none;">0</span></button>
    <button class="view-tab" data-view="archive" type="button">Archiwum <span class="tab-badge" id="archiveBadge" style="display:none;">0</span></button>
  </div>

  <div class="month-nav" id="monthNav">
    <button class="month-btn" id="prevMonth" aria-label="Poprzedni miesiąc">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h2 id="monthLabel">—</h2>
    <button class="month-btn" id="nextMonth" aria-label="Następny miesiąc">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="chip-today" id="gotoToday">Dziś</button>
  </div>

  <div class="calendar-layout" id="calendarLayout">
    <aside class="no-date-panel" id="noDatePanel">
      <div class="no-date-head">
        <span>Bez terminu</span>
        <div class="day-count" id="noDateCount">0</div>
      </div>
      <div class="no-date-list" id="noDateList"></div>
    </aside>
    <div class="calendar-main">
      <div class="weekday-row" id="weekdayRow"></div>
      <div id="boardWrap">
        <div class="board" id="board"></div>
      </div>
      <div class="flat-view" id="flatView" style="display:none;"></div>
    </div>
  </div>
</div>

<button class="fab" id="openAddFab" title="Nowe zadanie" aria-label="Dodaj nowe zadanie">
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Nowe zadanie</h2>
      <button class="modal-close" id="closeModal" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="taskForm">
      <div class="field">
        <label for="fTitle">Tytuł zadania</label>
        <input type="text" id="fTitle" placeholder="np. Wysłać ofertę do klienta" required>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fDiff">Poziom trudności</label>
          <select id="fDiff">
            <option>Łatwe</option>
            <option selected>Średnie</option>
            <option>Trudne</option>
          </select>
        </div>
        <div class="field">
          <label for="fDay">Dzień realizacji</label>
          <input type="date" id="fDay" required>
        </div>
      </div>
      <label class="checkbox-row" for="fNoDate">
        <input type="checkbox" id="fNoDate">
        To zadanie nie ma konkretnego terminu
      </label>
      <div class="field" id="fTimeField">
        <label>Przedział czasowy <span style="font-weight:500; color:var(--ink-faint);">(opcjonalnie, co 30 minut — dźwięk zagra o godzinie „Od”)</span></label>
        <div class="row2">
          <select id="fTimeStart" aria-label="Od godziny"></select>
          <select id="fTimeEnd" aria-label="Do godziny"></select>
        </div>
      </div>
      <label class="checkbox-row" for="fRecurring" id="fRecurringRow">
        <input type="checkbox" id="fRecurring">
        To zadanie się powtarza
      </label>
      <div class="field" id="fRecurrenceField" style="display:none;">
        <label for="fRecurrence">Jak często</label>
        <select id="fRecurrence">
          <option value="daily">Codziennie</option>
          <option value="weekly" selected>Co tydzień</option>
          <option value="monthly">Co miesiąc</option>
        </select>
      </div>
      <div class="field">
        <label>Jak pilne jest zadanie?</label>
        <div class="urgency-select" id="urgencySelect">
          <div class="urgency-opt sel-Niska" data-val="Niska">Niska</div>
          <div class="urgency-opt sel-Średnia active" data-val="Średnia">Średnia</div>
          <div class="urgency-opt sel-Wysoka" data-val="Wysoka">Wysoka</div>
          <div class="urgency-opt sel-Pilne" data-val="Pilne">Pilne</div>
        </div>
      </div>
      <div class="field">
        <label for="fStatus">Status</label>
        <select id="fStatus">
          <option>Do zrobienia</option>
          <option>W trakcie</option>
          <option>Zrobione</option>
        </select>
      </div>
      <div class="field">
        <label for="fDesc">Opis zadania</label>
        <textarea id="fDesc" placeholder="Dodatkowe szczegóły, kontekst, linki…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelModal">Anuluj</button>
        <button type="submit" class="btn-submit" id="submitBtn">Dodaj zadanie</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="urgentOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Pilne zadania</h2>
      <button class="modal-close" id="closeUrgent" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="urgent-list" id="urgentList"></div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastText">Zadanie dodane</span>
</div>

<script>
(function(){
  const STORAGE_KEY = 'workflow_v1_tasks';
  const THEME_KEY = 'workflow_v1_theme';
  const ACCENT_KEY = 'workflow_v1_accent';
  const DAY_NAMES = ['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
  const URGENCY_ORDER = {'Pilne':0,'Wysoka':1,'Średnia':2,'Niska':3};

  // Accent color palette. Each preset retints both the primary accent (buttons,
  // active states, links) and its soft tint — which the body background
  // gradient is built from — so the whole page shifts hue, not just one button.
  // Each preset also carries a tinted --bg (the page's base canvas color, not
  // just the corner highlight) so picking a color visibly recolors the whole
  // page — not only the buttons that happen to use --accent directly.
  const ACCENT_PRESETS = {
    blue:   { label:'Niebieski',    accent:'#3d5cff', softLight:'#eef1ff', softDark:'#232a45', bgLight:'#f4f5f9', bgDark:'#14161c' },
    violet: { label:'Fioletowy',    accent:'#8b5cf6', softLight:'#f1ecfe', softDark:'#2c2542', bgLight:'#f6f4fb', bgDark:'#18151f' },
    green:  { label:'Zielony',      accent:'#15a35a', softLight:'#e6f7ee', softDark:'#17351f', bgLight:'#f2f8f4', bgDark:'#121b15' },
    rose:   { label:'Różowy',       accent:'#e0437a', softLight:'#fdecf2', softDark:'#3a2230', bgLight:'#faf4f6', bgDark:'#1c1417' },
    amber:  { label:'Bursztynowy',  accent:'#c97a1f', softLight:'#fdf1e0', softDark:'#3a2c16', bgLight:'#f9f6f0', bgDark:'#1c1712' },
    teal:   { label:'Turkusowy',    accent:'#0d9488', softLight:'#e3f6f4', softDark:'#173330', bgLight:'#f0f7f6', bgDark:'#111c1a' }
  };
  let currentAccent = localStorage.getItem(ACCENT_KEY) || 'blue';
  if(!ACCENT_PRESETS[currentAccent]) currentAccent = 'blue';

  // Theme (light/dark) and accent color, both persisted; theme falls back to
  // the OS preference on first visit.
  function applyColors(){
    const mode = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const p = ACCENT_PRESETS[currentAccent];
    const bg = mode === 'dark' ? p.bgDark : p.bgLight;
    document.documentElement.style.setProperty('--accent', p.accent);
    document.documentElement.style.setProperty('--accent-soft', mode === 'dark' ? p.softDark : p.softLight);
    document.documentElement.style.setProperty('--bg', bg);
    // Some engines don't reliably repaint background-color on repeated custom
    // property changes — set it directly on <body> too as a belt-and-braces fix.
    document.body.style.backgroundColor = bg;
    document.querySelectorAll('.color-swatch').forEach(b => b.classList.toggle('active', b.dataset.color === currentAccent));
  }
  function applyTheme(mode){
    document.documentElement.setAttribute('data-theme', mode);
    localStorage.setItem(THEME_KEY, mode);
    applyColors();
  }
  (function initTheme(){
    const saved = localStorage.getItem(THEME_KEY);
    const mode = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', mode);
  })();
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  // Color picker: a popover of swatches next to the theme toggle
  const colorPopover = document.getElementById('colorPopover');
  colorPopover.innerHTML = Object.entries(ACCENT_PRESETS).map(([key, p]) =>
    `<button class="color-swatch" type="button" data-color="${key}" title="${p.label}" aria-label="${p.label}" style="background:${p.accent}"></button>`
  ).join('');
  colorPopover.addEventListener('click', (e)=>{
    const btn = e.target.closest('.color-swatch');
    if(!btn) return;
    currentAccent = btn.dataset.color;
    localStorage.setItem(ACCENT_KEY, currentAccent);
    applyColors();
    colorPopover.classList.remove('open');
  });
  document.getElementById('colorPickerBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    colorPopover.classList.toggle('open');
  });
  document.addEventListener('click', (e)=>{
    if(!colorPopover.contains(e.target) && e.target.id !== 'colorPickerBtn') colorPopover.classList.remove('open');
  });

  applyColors();

  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('taskForm');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');

  let urgencyVal = 'Średnia';
  let editingId = null;

  function loadTasks(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveTasks(tasks){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function uid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // Local (not UTC) YYYY-MM-DD key — toISOString() would shift the date near
  // midnight in timezones ahead of UTC, which caused tasks to land a day off.
  function dateKey(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function mondayOfWeek(d){
    const date = new Date(d);
    const day = date.getDay(); // 0 sun .. 6 sat
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  const MONTH_NAMES = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  const today = new Date(); today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-based
  let viewWeekStart = mondayOfWeek(today);
  let viewMode = 'month'; // today | week | month | overdue | archive
  let searchQuery = '';

  const RECUR_LABEL = {daily:'Codziennie', weekly:'Co tydzień', monthly:'Co miesiąc'};

  // Does task `t` land on calendar date `d`? Recurring tasks are stored once
  // and projected onto every matching future date instead of being duplicated.
  function taskOccursOn(t, d){
    if(!t.day) return false;
    const [y,m,dd] = t.day.split('-').map(Number);
    const base = new Date(y, m-1, dd);
    if(d < base) return false;
    switch(t.recurrence){
      case 'daily': return true;
      case 'weekly': return d.getDay() === base.getDay();
      case 'monthly': return d.getDate() === base.getDate();
      default: return dateKey(d) === t.day;
    }
  }

  const ICONS = {
    Pilne: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 16H3l9-16z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1" fill="currentColor"/></svg>',
    Wysoka: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 19V13M12 19V7M19 19v-9" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>',
    Średnia: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l2.5 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    Niska: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const URG_CLASS = {Pilne:'u-pilne', Wysoka:'u-wysoka', Średnia:'u-srednia', Niska:'u-niska'};

  function statusClass(s){
    if(s === 'Zrobione') return 'done';
    if(s === 'W trakcie') return 'progress';
    return '';
  }

  function fmtDayShort(dayKeyStr){
    const [y,m,d] = dayKeyStr.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString('pl-PL', {day:'2-digit', month:'2-digit'});
  }

  // `timeStart`/`timeEnd` is the current schema; `time` is the older single-time
  // field from before the range picker existed. Reading through this helper
  // keeps tasks saved before this change displaying and alerting correctly.
  function taskTimeStart(t){ return t.timeStart || t.time || ''; }
  function taskTimeLabel(t){
    const start = taskTimeStart(t);
    if(!start) return '';
    return t.timeEnd ? `${start}–${t.timeEnd}` : start;
  }
  const TIME_OPTIONS = Array.from({length:48}, (_, i) => {
    const h = String(Math.floor(i/2)).padStart(2,'0'), m = i % 2 === 0 ? '00' : '30';
    return `${h}:${m}`;
  });

  // Builds one task card. `showDate` adds a small date chip — used in the
  // no-date sidebar's "Zaplanuj" hint and in the pilne-zadania list, where
  // the surrounding context alone doesn't say which day a task belongs to.
  function buildTaskCard(t, opts){
    opts = opts || {};
    const isRecurring = t.recurrence && t.recurrence !== 'none';
    const isOverdue = t.day && !isRecurring && t.status !== 'Zrobione' && t.day < dateKey(today);
    const card = document.createElement('div');
    card.className = 'task ' + URG_CLASS[t.urgency] + (t.status==='Zrobione' ? ' is-done' : '') + (isOverdue ? ' is-overdue' : '');
    card.dataset.id = t.id;
    card.title = t.description || '';
    card.innerHTML = `
      <div class="task-top">
        <button class="task-check" data-id="${t.id}" aria-label="${t.status==='Zrobione' ? 'Cofnij ukończenie' : 'Oznacz jako zrobione'}" title="${t.status==='Zrobione' ? 'Cofnij ukończenie' : 'Oznacz jako zrobione'}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        ${isRecurring ? `<span class="recur-badge" title="Zadanie cykliczne: ${RECUR_LABEL[t.recurrence]}"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3M17 4v4h-4M7 20v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>` : ''}
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="urg-icon" title="Pilność: ${t.urgency}">${ICONS[t.urgency]}</div>
      </div>
      <div class="task-meta">
        <span class="badge diff-${t.difficulty}">${t.difficulty}</span>
        <span class="badge status-badge ${statusClass(t.status)}">${t.status}</span>
        ${taskTimeLabel(t) ? `<span class="task-time"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>${taskTimeLabel(t)}</span>` : ''}
        ${opts.showDate ? `<span class="task-day">${t.day ? fmtDayShort(t.day) : 'Bez terminu'}</span>` : ''}
      </div>
      <div class="task-foot">
        <button class="task-del" data-id="${t.id}" aria-label="Usuń zadanie" title="${isRecurring ? 'Usuń całą serię' : 'Usuń'}">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0l-1 13a2 2 0 01-2 2H9a2 2 0 01-2-2L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    `;
    card.querySelector('.task-check').addEventListener('click', (e)=>{
      e.stopPropagation();
      const all = loadTasks();
      const idx = all.findIndex(x=>x.id===t.id);
      if(idx !== -1){
        all[idx].status = all[idx].status === 'Zrobione' ? 'Do zrobienia' : 'Zrobione';
        saveTasks(all);
      }
      closeUrgentModal();
      render();
    });
    card.querySelector('.task-del').addEventListener('click', (e)=>{
      e.stopPropagation();
      const all = loadTasks().filter(x=>x.id!==t.id);
      saveTasks(all);
      closeUrgentModal();
      render();
    });
    card.addEventListener('click', ()=>{ closeUrgentModal(); openModal(t); });
    return card;
  }

  function updateBadge(id, n){
    const el = document.getElementById(id);
    el.textContent = n;
    el.style.display = n > 0 ? 'flex' : 'none';
  }

  function showFlatView(title, list, opts){
    opts = opts || {};
    document.getElementById('monthNav').style.display = 'none';
    document.getElementById('weekdayRow').style.display = 'none';
    document.getElementById('boardWrap').style.display = 'none';
    document.getElementById('noDatePanel').style.display = 'none';
    const flat = document.getElementById('flatView');
    flat.style.display = 'flex';
    flat.innerHTML = '';
    const heading = document.createElement('h2');
    heading.style.cssText = 'font-size:17px; font-weight:750; margin:0 0 4px; letter-spacing:-.01em;';
    heading.textContent = title;
    flat.appendChild(heading);
    if(list.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-day';
      empty.style.cssText = 'padding:28px 6px; font-size:14px; text-align:left;';
      empty.textContent = opts.emptyText || 'Brak zadań';
      flat.appendChild(empty);
    } else {
      list.forEach(t => flat.appendChild(buildTaskCard(t, {showDate: opts.showDate})));
    }
  }

  function hideFlatView(){
    document.getElementById('flatView').style.display = 'none';
    document.getElementById('boardWrap').style.display = '';
    document.getElementById('noDatePanel').style.display = '';
  }

  function renderDayColumn(dayDate, activeTasks, todayKey, opts){
    opts = opts || {};
    const dayKey = dateKey(dayDate);
    const isToday = dayKey === todayKey;
    const dayTasks = activeTasks.filter(t => taskOccursOn(t, dayDate))
      .sort((a,b)=> (URGENCY_ORDER[a.urgency]-URGENCY_ORDER[b.urgency]) || (a.title.localeCompare(b.title,'pl')));

    const col = document.createElement('div');
    col.className = 'day-col' + (isToday ? ' today' : '') + (opts.outside ? ' outside' : '');
    let label = `${dayDate.getDate()}${isToday ? ' · dziś' : ''}`;
    if(opts.big){
      label = dayDate.toLocaleDateString('pl-PL', {weekday:'long', day:'numeric', month:'long'});
      label = label.charAt(0).toUpperCase() + label.slice(1);
    }
    col.innerHTML = `
      <div class="day-head">
        <div class="name">${label}</div>
        <div class="day-count">${dayTasks.length}</div>
      </div>
      <div class="day-body"></div>
    `;
    const body = col.querySelector('.day-body');
    if(dayTasks.length === 0){
      body.innerHTML = `<div class="empty-day">Brak zadań</div>`;
    } else {
      dayTasks.forEach(t => body.appendChild(buildTaskCard(t)));
    }
    board.appendChild(col);
  }

  function setupMonthNav(){
    document.getElementById('prevMonth').setAttribute('aria-label','Poprzedni miesiąc');
    document.getElementById('nextMonth').setAttribute('aria-label','Następny miesiąc');
    document.getElementById('prevMonth').onclick = ()=>{ viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} render(); };
    document.getElementById('nextMonth').onclick = ()=>{ viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} render(); };
    document.getElementById('gotoToday').onclick = ()=>{ viewYear = today.getFullYear(); viewMonth = today.getMonth(); render(); };
  }
  function renderNoDateSidebar(activeTasks){
    const noDateTasks = activeTasks.filter(t => !t.day)
      .sort((a,b)=> (URGENCY_ORDER[a.urgency]-URGENCY_ORDER[b.urgency]) || (a.title.localeCompare(b.title,'pl')));
    const noDateList = document.getElementById('noDateList');
    document.getElementById('noDateCount').textContent = noDateTasks.length;
    noDateList.innerHTML = '';
    if(noDateTasks.length === 0){
      noDateList.innerHTML = `<div class="empty-day">Brak zadań bez terminu</div>`;
    } else {
      noDateTasks.forEach(t => noDateList.appendChild(buildTaskCard(t)));
    }
  }

  function setupWeekNav(){
    document.getElementById('prevMonth').setAttribute('aria-label','Poprzedni tydzień');
    document.getElementById('nextMonth').setAttribute('aria-label','Następny tydzień');
    document.getElementById('prevMonth').onclick = ()=>{ viewWeekStart = new Date(viewWeekStart); viewWeekStart.setDate(viewWeekStart.getDate()-7); render(); };
    document.getElementById('nextMonth').onclick = ()=>{ viewWeekStart = new Date(viewWeekStart); viewWeekStart.setDate(viewWeekStart.getDate()+7); render(); };
    document.getElementById('gotoToday').onclick = ()=>{ viewWeekStart = mondayOfWeek(today); render(); };
  }

  function render(){
    const allTasks = loadTasks();
    const todayKey = dateKey(today);
    const activeTasks = allTasks.filter(t => t.status !== 'Zrobione');
    const archiveTasks = allTasks.filter(t => t.status === 'Zrobione')
      .sort((a,b)=> (b.day||'').localeCompare(a.day||'') || a.title.localeCompare(b.title,'pl'));
    const overdueTasks = activeTasks.filter(t => t.day && (!t.recurrence || t.recurrence==='none') && t.day < todayKey)
      .sort((a,b)=> a.day.localeCompare(b.day));

    updateBadge('overdueBadge', overdueTasks.length);
    updateBadge('archiveBadge', archiveTasks.length);
    document.getElementById('cntAll').textContent = activeTasks.length;
    document.getElementById('cntPilne').textContent = activeTasks.filter(t=>t.urgency==='Pilne').length;

    board.className = 'board';
    board.style.display = 'grid';

    if(allTasks.length === 0){
      hideFlatView();
      document.getElementById('monthNav').style.display = 'none';
      document.getElementById('weekdayRow').style.display = 'none';
      document.getElementById('noDatePanel').style.display = 'none';
      board.style.display = 'block';
      board.innerHTML = `<div class="global-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <h3>Brak zadań</h3>
        <p>Kliknij „Nowe zadanie”, aby dodać pierwsze zadanie do panelu.</p>
      </div>`;
      return;
    }

    // Search overrides whichever tab is selected, without switching tabs.
    const q = searchQuery.trim().toLocaleLowerCase('pl');
    if(q){
      const results = allTasks.filter(t => t.title.toLocaleLowerCase('pl').includes(q))
        .sort((a,b)=> (a.day || '9999-99-99').localeCompare(b.day || '9999-99-99'));
      showFlatView(`Wyniki wyszukiwania: „${searchQuery.trim()}”`, results, {showDate:true, emptyText:'Brak zadań pasujących do wyszukiwania'});
      return;
    }

    if(viewMode === 'overdue'){
      showFlatView('Zaległe zadania', overdueTasks, {showDate:true, emptyText:'Brak zaległych zadań — wszystko na czas 🎉'});
      return;
    }
    if(viewMode === 'archive'){
      showFlatView('Ukończone zadania', archiveTasks, {showDate:true, emptyText:'Archiwum jest puste'});
      return;
    }

    hideFlatView();
    renderNoDateSidebar(activeTasks);

    if(viewMode === 'today'){
      document.getElementById('monthNav').style.display = 'none';
      document.getElementById('weekdayRow').style.display = 'none';
      board.className = 'board single';
      board.innerHTML = '';
      renderDayColumn(today, activeTasks, todayKey, {big:true});
      return;
    }

    if(viewMode === 'week'){
      document.getElementById('monthNav').style.display = 'flex';
      document.getElementById('weekdayRow').style.display = 'grid';
      setupWeekNav();
      const weekEnd = new Date(viewWeekStart); weekEnd.setDate(viewWeekStart.getDate()+6);
      document.getElementById('monthLabel').textContent = `${fmtDayShort(dateKey(viewWeekStart))} – ${fmtDayShort(dateKey(weekEnd))}`;
      board.innerHTML = '';
      for(let i=0; i<7; i++){
        const dayDate = new Date(viewWeekStart); dayDate.setDate(viewWeekStart.getDate()+i);
        renderDayColumn(dayDate, activeTasks, todayKey, {});
      }
      return;
    }

    // month (default)
    document.getElementById('monthNav').style.display = 'flex';
    document.getElementById('weekdayRow').style.display = 'grid';
    setupMonthNav();
    document.getElementById('monthLabel').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

    const monthStart = new Date(viewYear, viewMonth, 1);
    const monthEnd = new Date(viewYear, viewMonth + 1, 0);
    const gridStart = mondayOfWeek(monthStart);
    const lastWeekMonday = mondayOfWeek(monthEnd);
    const gridEnd = new Date(lastWeekMonday); gridEnd.setDate(lastWeekMonday.getDate() + 6);
    const totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;

    board.innerHTML = '';
    for(let i=0; i<totalDays; i++){
      const dayDate = new Date(gridStart); dayDate.setDate(gridStart.getDate()+i);
      renderDayColumn(dayDate, activeTasks, todayKey, {outside: dayDate.getMonth() !== viewMonth});
    }
  }

  function closeUrgentModal(){
    document.getElementById('urgentOverlay').classList.remove('open');
  }
  function openUrgentModal(){
    const list = document.getElementById('urgentList');
    const urgentTasks = loadTasks().filter(t=>t.urgency==='Pilne' && t.status!=='Zrobione')
      .sort((a,b)=> (a.day || '9999-99-99').localeCompare(b.day || '9999-99-99'));
    list.innerHTML = '';
    if(urgentTasks.length === 0){
      list.innerHTML = `<div class="empty-day">Brak pilnych zadań — wszystko na spokojnie 🎉</div>`;
    } else {
      urgentTasks.forEach(t => list.appendChild(buildTaskCard(t, {showDate:true})));
    }
    document.getElementById('urgentOverlay').classList.add('open');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Modal open/close — pass a task to edit it, or nothing to add a new one
  const fDay = document.getElementById('fDay');
  const fTimeStart = document.getElementById('fTimeStart');
  const fTimeEnd = document.getElementById('fTimeEnd');
  const fNoDate = document.getElementById('fNoDate');
  const fRecurring = document.getElementById('fRecurring');
  const fRecurrence = document.getElementById('fRecurrence');

  // Populate the 30-minute interval dropdowns once. "Do" also gets a leading
  // blank option since an end time is optional even when a start is set.
  fTimeStart.innerHTML = `<option value="">—</option>` + TIME_OPTIONS.map(t=>`<option value="${t}">${t}</option>`).join('');
  fTimeEnd.innerHTML = `<option value="">—</option>` + TIME_OPTIONS.map(t=>`<option value="${t}">${t}</option>`).join('');

  function applyRecurringState(on){
    document.getElementById('fRecurrenceField').style.display = on ? 'flex' : 'none';
  }
  function applyNoDateState(noDate){
    fDay.disabled = noDate;
    fTimeStart.disabled = noDate;
    fTimeEnd.disabled = noDate;
    document.getElementById('fTimeField').style.opacity = noDate ? .45 : 1;
    document.getElementById('fTimeField').style.pointerEvents = noDate ? 'none' : 'auto';
    if(noDate){ fDay.removeAttribute('required'); } else { fDay.setAttribute('required','required'); }
    // Recurring tasks need a start date, so the two options are mutually exclusive.
    document.getElementById('fRecurringRow').style.display = noDate ? 'none' : 'flex';
    if(noDate){ fRecurring.checked = false; applyRecurringState(false); }
  }

  function openModal(task){
    editingId = task ? task.id : null;
    document.getElementById('modalTitle').textContent = task ? 'Edytuj zadanie' : 'Nowe zadanie';
    document.getElementById('submitBtn').textContent = task ? 'Zapisz zmiany' : 'Dodaj zadanie';

    document.getElementById('fTitle').value = task ? task.title : '';
    document.getElementById('fDiff').value = task ? task.difficulty : 'Średnie';
    fNoDate.checked = task ? !task.day : false;
    fDay.value = task ? (task.day || '') : dateKey(new Date());
    fTimeStart.value = task ? taskTimeStart(task) : '';
    fTimeEnd.value = task ? (task.timeEnd || '') : '';
    applyNoDateState(fNoDate.checked);

    const hasRecurrence = task && task.recurrence && task.recurrence !== 'none';
    fRecurring.checked = !fNoDate.checked && !!hasRecurrence;
    fRecurrence.value = hasRecurrence ? task.recurrence : 'weekly';
    applyRecurringState(fRecurring.checked);

    document.getElementById('fStatus').value = task ? task.status : 'Do zrobienia';
    document.getElementById('fDesc').value = task ? (task.description || '') : '';

    urgencyVal = task ? task.urgency : 'Średnia';
    document.querySelectorAll('.urgency-opt').forEach(o=>o.classList.toggle('active', o.dataset.val===urgencyVal));

    overlay.classList.add('open');
    setTimeout(()=>document.getElementById('fTitle').focus(), 120);
  }
  function closeModal(){
    overlay.classList.remove('open');
    form.reset();
    applyNoDateState(false);
    applyRecurringState(false);
    editingId = null;
    urgencyVal = 'Średnia';
    document.querySelectorAll('.urgency-opt').forEach(o=>o.classList.toggle('active', o.dataset.val==='Średnia'));
  }

  fNoDate.addEventListener('change', ()=> applyNoDateState(fNoDate.checked));
  fRecurring.addEventListener('change', ()=> applyRecurringState(fRecurring.checked));

  document.getElementById('openAddTop').addEventListener('click', ()=>openModal());
  document.getElementById('openAddFab').addEventListener('click', ()=>openModal());
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelModal').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e)=>{
    if(e.key !== 'Escape') return;
    if(overlay.classList.contains('open')) closeModal();
    if(document.getElementById('urgentOverlay').classList.contains('open')) closeUrgentModal();
  });

  document.getElementById('statPilne').addEventListener('click', openUrgentModal);
  document.getElementById('closeUrgent').addEventListener('click', closeUrgentModal);
  document.getElementById('urgentOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'urgentOverlay') closeUrgentModal();
  });

  document.getElementById('urgencySelect').addEventListener('click', (e)=>{
    const opt = e.target.closest('.urgency-opt');
    if(!opt) return;
    urgencyVal = opt.dataset.val;
    document.querySelectorAll('.urgency-opt').forEach(o=>o.classList.toggle('active', o===opt));
  });

  function showToast(msg){
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 2200);
  }

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const title = document.getElementById('fTitle').value.trim();
    const difficulty = document.getElementById('fDiff').value;
    const day = fNoDate.checked ? '' : fDay.value;
    const timeStart = fNoDate.checked ? '' : fTimeStart.value;
    // An end time only makes sense paired with a start, and after it.
    let timeEnd = (fNoDate.checked || !timeStart) ? '' : fTimeEnd.value;
    if(timeEnd && timeEnd <= timeStart) timeEnd = '';
    const recurrence = (!fNoDate.checked && fRecurring.checked) ? fRecurrence.value : 'none';
    const status = document.getElementById('fStatus').value;
    const description = document.getElementById('fDesc').value.trim();
    if(!title) return;
    if(!fNoDate.checked && !day) return;

    const tasks = loadTasks();
    if(editingId){
      const idx = tasks.findIndex(x=>x.id===editingId);
      if(idx !== -1){
        const prev = tasks[idx];
        // Reset the fired-reminder marker whenever day/time/recurrence actually
        // changed, so an edited task can alert again.
        const sameSchedule = prev.day===day && taskTimeStart(prev)===timeStart && prev.recurrence===recurrence;
        const notifiedAt = sameSchedule ? prev.notifiedAt : null;
        tasks[idx] = { ...prev, title, difficulty, urgency: urgencyVal, day, time: undefined, timeStart, timeEnd, recurrence, status, description, notifiedAt };
      }
      saveTasks(tasks);
      closeModal();
      showToast('Zadanie zostało zaktualizowane');
    } else {
      tasks.push({ id: uid(), title, difficulty, urgency: urgencyVal, day, timeStart, timeEnd, recurrence, status, description, createdAt: Date.now(), notifiedAt: null });
      saveTasks(tasks);
      closeModal();
      showToast('Zadanie zostało dodane');
    }
    render();
  });

  // Live updates across tabs
  window.addEventListener('storage', (e)=>{
    if(e.key === STORAGE_KEY) render();
  });

  // Live clock
  const clockEl = document.getElementById('liveClock');
  function tickClock(){
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'});
  }

  // Notification permission (best-effort, silently ignored if unsupported/denied)
  if('Notification' in window && Notification.permission === 'default'){
    // Ask only once the user has actually created a task with a reminder time,
    // not on cold load — avoids an unsolicited permission prompt.
  }

  function beep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [0, 0.22, 0.44].forEach((t, i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = i === 2 ? 1046.5 : 880;
        gain.gain.setValueAtTime(0, now + t);
        gain.gain.linearRampToValueAtTime(0.22, now + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + t + 0.18);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + t);
        osc.stop(now + t + 0.2);
      });
    }catch(e){ /* audio unavailable — ignore */ }
  }

  function checkDueTasks(){
    const now = new Date();
    const todayKey = dateKey(now);
    const hhmm = now.toTimeString().slice(0,5);
    const tasks = loadTasks();
    let changed = false;
    tasks.forEach(t=>{
      const start = taskTimeStart(t);
      if(!start || t.status === 'Zrobione') return;
      if(!taskOccursOn(t, now)) return;
      if(start !== hhmm) return;
      if(t.notifiedAt === todayKey + start) return; // already fired for this minute

      t.notifiedAt = todayKey + start;
      changed = true;
      beep();
      showToast(`⏰ „${t.title}" — czas na to zadanie`);
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification('Workflow — zadanie do zrobienia', { body: t.title, tag: t.id }); }catch(e){}
      }
      const card = document.querySelector(`.task[data-id="${t.id}"]`);
      if(card){ card.classList.add('is-firing'); setTimeout(()=>card.classList.remove('is-firing'), 3200); }
    });
    if(changed) saveTasks(tasks);
  }

  // Ask for notification permission the first time a reminder time is actually set
  fTimeStart.addEventListener('change', function(){
    if(this.value && 'Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission().catch(()=>{});
    }
  });

  tickClock();
  setInterval(tickClock, 15000);
  setInterval(checkDueTasks, 20000);
  checkDueTasks();

  // Weekday header (built once — always Mon–Sun regardless of viewed month)
  document.getElementById('weekdayRow').innerHTML = DAY_NAMES.map(n=>`<span>${n.slice(0,3)}</span>`).join('');
  // Month/week nav button handlers are (re)assigned per render by
  // setupMonthNav()/setupWeekNav(), since the two modes drive different state.

  // View tabs (Dziś / Tydzień / Miesiąc / Zaległe / Archiwum)
  document.querySelectorAll('.view-tab').forEach(btn=>{
    if(btn.dataset.view === viewMode) btn.classList.add('active');
    btn.addEventListener('click', ()=>{
      viewMode = btn.dataset.view;
      document.querySelectorAll('.view-tab').forEach(b=>b.classList.toggle('active', b===btn));
      render();
    });
  });

  // Search — filters by title across every task, live, without switching tabs
  document.getElementById('searchInput').addEventListener('input', function(){
    searchQuery = this.value;
    render();
  });

  render();
})();
</script>

</body>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow — Panel zadań</title>
<style>
  :root{
    --bg:#f4f5f7;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --border:#e3e6eb;
    --ink:#1c2128;
    --ink-soft:#5b6472;
    --ink-faint:#8891a0;
    --accent:#3d5cff;
    --accent-ink:#ffffff;
    --accent-soft:#eef1ff;
    --urgent:#e0433f;
    --urgent-soft:#fdeceb;
    --high:#e08a2b;
    --high-soft:#fdf1e2;
    --mid:#2b8ce0;
    --mid-soft:#e7f2fd;
    --low:#3aa66c;
    --low-soft:#e8f6ee;
    --done:#8891a0;
    --done-soft:#eef0f3;
    --shadow-sm:0 1px 2px rgba(20,24,33,.06);
    --shadow-md:0 6px 20px -4px rgba(20,24,33,.14), 0 2px 6px rgba(20,24,33,.06);
    --shadow-lg:0 24px 60px -12px rgba(20,24,33,.28);
    --radius:14px;
    --radius-sm:9px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font);
    background:
      radial-gradient(1200px 500px at 100% -10%, #eef1ff 0%, transparent 60%),
      radial-gradient(900px 400px at -10% 0%, #eaf6f0 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:1320px; margin:0 auto; padding:28px 32px 120px;}

  /* Header */
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; margin-bottom:28px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,#4b6bff,#3d5cff 55%,#2f46d6);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-sm);
    flex-shrink:0;
  }
  .brand-mark svg{width:20px; height:20px;}
  .brand-text h1{font-size:19px; margin:0; font-weight:700; letter-spacing:-0.01em;}
  .brand-text p{margin:1px 0 0; font-size:12.5px; color:var(--ink-faint);}

  .top-actions{display:flex; align-items:center; gap:10px;}

  .stat-pill{
    display:flex; align-items:center; gap:7px;
    background:var(--surface); border:1px solid var(--border);
    padding:8px 14px; border-radius:999px; font-size:12.5px;
    color:var(--ink-soft); box-shadow:var(--shadow-sm); font-weight:600;
  }
  .stat-pill b{color:var(--ink); font-weight:700;}
  .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}

  .btn-primary{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:var(--accent-ink);
    border:none; padding:11px 18px; border-radius:11px;
    font-size:14px; font-weight:600; cursor:pointer;
    box-shadow:0 8px 20px -6px rgba(61,92,255,.55);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    font-family:inherit;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 12px 26px -6px rgba(61,92,255,.6); background:#3352f0;}
  .btn-primary:active{transform:translateY(0px) scale(.98);}
  .btn-primary svg{width:16px; height:16px;}

  /* Board */
  /* Month navigation */
  .month-nav{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .month-nav h2{
    font-size:18px; font-weight:750; letter-spacing:-.01em; margin:0;
    min-width:190px; text-transform:capitalize;
  }
  .month-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .month-btn svg{width:15px; height:15px;}
  .month-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .chip-today{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:999px; cursor:pointer;
    font-family:inherit; transition:all .15s ease; margin-left:2px;
  }
  .chip-today:hover{border-color:var(--accent); color:var(--accent);}

  .weekday-row{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:14px;
    margin-bottom:8px; padding:0 2px;
  }
  .weekday-row span{
    font-size:11.5px; font-weight:700; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:.03em; text-align:left; padding-left:2px;
  }

  /* Month grid */
  .board{
    display:grid;
    grid-template-columns:repeat(7, minmax(0,1fr));
    gap:14px;
  }
  @media (max-width:900px){
    .board{grid-template-columns:repeat(1, 1fr);}
    .weekday-row{display:none;}
  }

  .day-col{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    display:flex; flex-direction:column;
    min-height:120px;
    overflow:hidden;
  }
  .day-col.outside{opacity:.45;}
  .day-col.today{
    border-color:#c7d0ff;
    background:linear-gradient(180deg,#f4f6ff, var(--surface-2) 90px);
  }
  .day-head{
    padding:10px 12px 8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .day-head .name{font-size:12.5px; font-weight:700; letter-spacing:-.01em;}
  .day-col.today .day-head .name{color:var(--accent);}
  .day-count{
    font-size:10.5px; font-weight:700; color:var(--ink-faint);
    background:var(--surface); border:1px solid var(--border);
    min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
  }

  .day-body{padding:0 8px 10px; display:flex; flex-direction:column; gap:6px; flex:1;}

  .empty-day{
    margin:2px 2px 4px; padding:10px 6px;
    color:var(--ink-faint); font-size:11px; text-align:center;
    font-weight:500;
  }

  /* Task card */
  .task{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:9px 10px 8px;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    position:relative;
  }
  .task:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:#d7dbe3;}
  .task.u-pilne{background:linear-gradient(180deg,var(--urgent-soft) 0%, var(--surface) 46px);}
  .task.is-done{opacity:.6;}
  .task.is-done .task-title{text-decoration:line-through; color:var(--ink-faint);}

  .task-top{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;}
  .task-title{font-size:13.5px; font-weight:650; line-height:1.35; color:var(--ink); word-break:break-word;}

  .urg-icon{
    flex-shrink:0; width:20px; height:20px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .urg-icon svg{width:12px; height:12px;}
  .u-pilne .urg-icon{background:var(--urgent-soft); color:var(--urgent);}
  .u-wysoka .urg-icon{background:var(--high-soft); color:var(--high);}
  .u-srednia .urg-icon{background:var(--mid-soft); color:var(--mid);}
  .u-niska .urg-icon{background:var(--low-soft); color:var(--low);}

  .task-time{
    display:inline-flex; align-items:center; gap:4px;
    font-size:10.5px; font-weight:700; color:var(--ink-soft);
    background:var(--surface-2); border:1px solid var(--border);
    padding:3px 7px 3px 6px; border-radius:6px;
  }
  .task-time svg{width:10px; height:10px; flex-shrink:0;}
  .task.is-firing{animation:taskPulse 1s ease-in-out 3;}
  @keyframes taskPulse{
    0%,100%{box-shadow:var(--shadow-sm);}
    50%{box-shadow:0 0 0 3px var(--urgent-soft), var(--shadow-md);}
  }

  .task-meta{display:flex; align-items:center; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .badge{
    font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px;
    letter-spacing:.01em; display:inline-flex; align-items:center; gap:4px;
  }
  .diff-Łatwe{background:var(--low-soft); color:var(--low);}
  .diff-Średnie{background:var(--high-soft); color:var(--high);}
  .diff-Trudne{background:var(--urgent-soft); color:var(--urgent);}

  .status-badge{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border);}
  .status-badge.done{background:var(--low-soft); color:var(--low); border-color:transparent;}
  .status-badge.progress{background:var(--mid-soft); color:var(--mid); border-color:transparent;}

  .task-foot{display:flex; align-items:center; justify-content:flex-end; margin-top:9px; padding-top:8px; border-top:1px dashed var(--border);}
  .task-del{
    background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:3px;
    border-radius:6px; display:flex; opacity:0; transition:opacity .12s ease, color .12s ease, background .12s ease;
  }
  .task:hover .task-del{opacity:1;}
  .task-del:hover{color:var(--urgent); background:var(--urgent-soft);}
  .task-del svg{width:13px; height:13px;}

  /* Empty state (no tasks anywhere) */
  .global-empty{
    text-align:center; padding:70px 20px 40px; color:var(--ink-faint);
  }
  .global-empty svg{width:56px; height:56px; margin-bottom:14px; opacity:.5;}
  .global-empty h3{color:var(--ink); font-size:16px; margin:0 0 6px;}
  .global-empty p{margin:0; font-size:13.5px;}

  /* FAB */
  .fab{
    position:fixed; right:28px; bottom:28px;
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; cursor:pointer;
    box-shadow:0 14px 30px -8px rgba(61,92,255,.6);
    display:flex; align-items:center; justify-content:center;
    transition:transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s ease;
    z-index:40;
  }
  .fab:hover{transform:scale(1.06) rotate(90deg); box-shadow:0 18px 36px -8px rgba(61,92,255,.7);}
  .fab svg{width:24px; height:24px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(17,20,28,.5);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}

  .modal{
    background:var(--surface); width:100%; max-width:520px;
    border-radius:18px; box-shadow:var(--shadow-lg);
    max-height:90vh; overflow-y:auto;
    transform:translateY(14px) scale(.98); transition:transform .2s cubic-bezier(.2,.9,.3,1);
  }
  .overlay.open .modal{transform:translateY(0) scale(1);}

  .modal-head{
    padding:22px 26px 16px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--surface); z-index:2;
  }
  .modal-head h2{margin:0; font-size:18px; font-weight:750; letter-spacing:-.01em;}
  .modal-close{
    background:var(--surface-2); border:1px solid var(--border); width:30px; height:30px;
    border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
  }
  .modal-close:hover{background:var(--urgent-soft); color:var(--urgent); border-color:transparent;}
  .modal-close svg{width:15px; height:15px;}

  form{padding:2px 26px 26px; display:flex; flex-direction:column; gap:16px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  input[type=text], input[type=date], select, textarea{
    font-family:inherit; font-size:14px; color:var(--ink);
    background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:10px; padding:10px 12px; outline:none;
    transition:border-color .15s ease, background .15s ease;
    width:100%;
  }
  input[type=text]:focus, input[type=date]:focus, select:focus, textarea:focus{
    border-color:var(--accent); background:var(--surface);
  }
  textarea{resize:vertical; min-height:74px; line-height:1.5;}
  select{cursor:pointer; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%235b6472' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:32px;
  }

  .urgency-select{display:flex; gap:8px;}
  .urgency-opt{
    flex:1; text-align:center; padding:9px 4px; border-radius:9px; cursor:pointer;
    border:1.5px solid var(--border); font-size:12px; font-weight:700; color:var(--ink-soft);
    background:var(--surface-2); transition:all .15s ease; user-select:none;
  }
  .urgency-opt.sel-Niska.active{background:var(--low-soft); border-color:var(--low); color:var(--low);}
  .urgency-opt.sel-Średnia.active{background:var(--mid-soft); border-color:var(--mid); color:var(--mid);}
  .urgency-opt.sel-Wysoka.active{background:var(--high-soft); border-color:var(--high); color:var(--high);}
  .urgency-opt.sel-Pilne.active{background:var(--urgent-soft); border-color:var(--urgent); color:var(--urgent);}

  .modal-actions{display:flex; gap:10px; margin-top:4px;}
  .btn-ghost{
    flex:1; background:var(--surface-2); border:1.5px solid var(--border); color:var(--ink-soft);
    padding:11px; border-radius:11px; font-weight:650; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn-ghost:hover{background:var(--border);}
  .btn-submit{
    flex:2; background:var(--accent); border:none; color:#fff;
    padding:11px; border-radius:11px; font-weight:650; font-size:14px; cursor:pointer; font-family:inherit;
    box-shadow:0 8px 20px -6px rgba(61,92,255,.5);
  }
  .btn-submit:hover{background:#3352f0;}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:11px;
    font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg);
    display:flex; align-items:center; gap:8px;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast svg{width:15px; height:15px; color:#3aa66c; flex-shrink:0;}

  @media (max-width:720px){
    .wrap{padding:20px 16px 110px;}
    .board{grid-template-columns:1fr;}
    header.top{align-items:flex-start;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h13" stroke="white" stroke-width="2.3" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <h1>Workflow</h1>
        <p>Panel zadań — cały miesiąc na raz</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="stat-pill" id="clockPill" title="Aktualny czas">
        <svg viewBox="0 0 24 24" fill="none" width="13" height="13"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <b id="liveClock">--:--</b>
      </div>
      <div class="stat-pill" id="statPilne"><span class="dot" style="background:var(--urgent)"></span> <b id="cntPilne">0</b> pilnych</div>
      <div class="stat-pill" id="statAll"><span class="dot" style="background:var(--accent)"></span> <b id="cntAll">0</b> zadań</div>
      <button class="btn-primary" id="openAddTop">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        Nowe zadanie
      </button>
    </div>
  </header>

  <div class="month-nav">
    <button class="month-btn" id="prevMonth" aria-label="Poprzedni miesiąc">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h2 id="monthLabel">—</h2>
    <button class="month-btn" id="nextMonth" aria-label="Następny miesiąc">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="chip-today" id="gotoToday">Dziś</button>
  </div>

  <div class="weekday-row" id="weekdayRow"></div>

  <div id="boardWrap">
    <div class="board" id="board"></div>
  </div>
</div>

<button class="fab" id="openAddFab" title="Nowe zadanie" aria-label="Dodaj nowe zadanie">
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Nowe zadanie</h2>
      <button class="modal-close" id="closeModal" aria-label="Zamknij">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="taskForm">
      <div class="field">
        <label for="fTitle">Tytuł zadania</label>
        <input type="text" id="fTitle" placeholder="np. Wysłać ofertę do klienta" required>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fDiff">Poziom trudności</label>
          <select id="fDiff">
            <option>Łatwe</option>
            <option selected>Średnie</option>
            <option>Trudne</option>
          </select>
        </div>
        <div class="field">
          <label for="fDay">Dzień realizacji</label>
          <input type="date" id="fDay" required>
        </div>
      </div>
      <div class="field">
        <label for="fTime">Godzina przypomnienia <span style="font-weight:500; color:var(--ink-faint);">(opcjonalnie — zagra dźwięk o tej porze)</span></label>
        <input type="time" id="fTime">
      </div>
      <div class="field">
        <label>Jak pilne jest zadanie?</label>
        <div class="urgency-select" id="urgencySelect">
          <div class="urgency-opt sel-Niska" data-val="Niska">Niska</div>
          <div class="urgency-opt sel-Średnia active" data-val="Średnia">Średnia</div>
          <div class="urgency-opt sel-Wysoka" data-val="Wysoka">Wysoka</div>
          <div class="urgency-opt sel-Pilne" data-val="Pilne">Pilne</div>
        </div>
      </div>
      <div class="field">
        <label for="fStatus">Status</label>
        <select id="fStatus">
          <option>Do zrobienia</option>
          <option>W trakcie</option>
          <option>Zrobione</option>
        </select>
      </div>
      <div class="field">
        <label for="fDesc">Opis zadania</label>
        <textarea id="fDesc" placeholder="Dodatkowe szczegóły, kontekst, linki…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelModal">Anuluj</button>
        <button type="submit" class="btn-submit" id="submitBtn">Dodaj zadanie</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastText">Zadanie dodane</span>
</div>

<script>
(function(){
  const STORAGE_KEY = 'workflow_v1_tasks';
  const DAY_NAMES = ['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
  const URGENCY_ORDER = {'Pilne':0,'Wysoka':1,'Średnia':2,'Niska':3};

  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('taskForm');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');

  let urgencyVal = 'Średnia';
  let editingId = null;

  function loadTasks(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveTasks(tasks){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function uid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // Local (not UTC) YYYY-MM-DD key — toISOString() would shift the date near
  // midnight in timezones ahead of UTC, which caused tasks to land a day off.
  function dateKey(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function mondayOfWeek(d){
    const date = new Date(d);
    const day = date.getDay(); // 0 sun .. 6 sat
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  const MONTH_NAMES = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  const today = new Date(); today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-based

  const ICONS = {
    Pilne: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 16H3l9-16z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1" fill="currentColor"/></svg>',
    Wysoka: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 19V13M12 19V7M19 19v-9" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>',
    Średnia: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l2.5 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    Niska: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const URG_CLASS = {Pilne:'u-pilne', Wysoka:'u-wysoka', Średnia:'u-srednia', Niska:'u-niska'};

  function statusClass(s){
    if(s === 'Zrobione') return 'done';
    if(s === 'W trakcie') return 'progress';
    return '';
  }

  function render(){
    const tasks = loadTasks();
    const todayKey = dateKey(today);

    document.getElementById('monthLabel').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

    // stats reflect the month currently on screen
    const monthStart = new Date(viewYear, viewMonth, 1);
    const monthEnd = new Date(viewYear, viewMonth + 1, 0);
    const monthStartKey = dateKey(monthStart), monthEndKey = dateKey(monthEnd);
    const visible = tasks.filter(t => t.day >= monthStartKey && t.day <= monthEndKey);

    document.getElementById('cntAll').textContent = visible.length;
    document.getElementById('cntPilne').textContent = visible.filter(t=>t.urgency==='Pilne' && t.status!=='Zrobione').length;

    board.innerHTML = '';
    if(tasks.length === 0){
      board.style.display = 'block';
      board.innerHTML = `<div class="global-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <h3>Brak zadań</h3>
        <p>Kliknij „Nowe zadanie”, aby dodać pierwsze zadanie do panelu.</p>
      </div>`;
      return;
    }
    board.style.display = 'grid';

    // Full month grid: from the Monday of the week containing the 1st,
    // through the Sunday of the week containing the last day of the month.
    const gridStart = mondayOfWeek(monthStart);
    const lastWeekMonday = mondayOfWeek(monthEnd);
    const gridEnd = new Date(lastWeekMonday); gridEnd.setDate(lastWeekMonday.getDate() + 6);
    const totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;

    for(let i=0; i<totalDays; i++){
      const dayDate = new Date(gridStart); dayDate.setDate(gridStart.getDate()+i);
      const dayKey = dateKey(dayDate);
      const isToday = dayKey === todayKey;
      const isOutside = dayDate.getMonth() !== viewMonth;

      const dayTasks = tasks.filter(t => t.day === dayKey)
        .sort((a,b)=> (URGENCY_ORDER[a.urgency]-URGENCY_ORDER[b.urgency]) || (a.title.localeCompare(b.title,'pl')));

      const col = document.createElement('div');
      col.className = 'day-col' + (isToday ? ' today' : '') + (isOutside ? ' outside' : '');
      col.innerHTML = `
        <div class="day-head">
          <div class="name">${dayDate.getDate()}${isToday ? ' · dziś' : ''}</div>
          <div class="day-count">${dayTasks.length}</div>
        </div>
        <div class="day-body"></div>
      `;
      const body = col.querySelector('.day-body');
      if(dayTasks.length === 0){
        body.innerHTML = `<div class="empty-day">Brak zadań</div>`;
      } else {
        dayTasks.forEach(t=>{
          const card = document.createElement('div');
          card.className = 'task ' + URG_CLASS[t.urgency] + (t.status==='Zrobione' ? ' is-done' : '');
          card.dataset.id = t.id;
          card.title = t.description || '';
          card.innerHTML = `
            <div class="task-top">
              <div class="task-title">${escapeHtml(t.title)}</div>
              <div class="urg-icon" title="Pilność: ${t.urgency}">${ICONS[t.urgency]}</div>
            </div>
            <div class="task-meta">
              <span class="badge diff-${t.difficulty}">${t.difficulty}</span>
              <span class="badge status-badge ${statusClass(t.status)}">${t.status}</span>
              ${t.time ? `<span class="task-time"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>${t.time}</span>` : ''}
            </div>
            <div class="task-foot">
              <button class="task-del" data-id="${t.id}" aria-label="Usuń zadanie" title="Usuń">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0l-1 13a2 2 0 01-2 2H9a2 2 0 01-2-2L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          `;
          card.querySelector('.task-del').addEventListener('click', (e)=>{
            e.stopPropagation();
            const all = loadTasks().filter(x=>x.id!==t.id);
            saveTasks(all);
            render();
          });
          card.addEventListener('click', ()=> openModal(t));
          body.appendChild(card);
        });
      }
      board.appendChild(col);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Modal open/close — pass a task to edit it, or nothing to add a new one
  function openModal(task){
    editingId = task ? task.id : null;
    document.getElementById('modalTitle').textContent = task ? 'Edytuj zadanie' : 'Nowe zadanie';
    document.getElementById('submitBtn').textContent = task ? 'Zapisz zmiany' : 'Dodaj zadanie';

    document.getElementById('fTitle').value = task ? task.title : '';
    document.getElementById('fDiff').value = task ? task.difficulty : 'Średnie';
    document.getElementById('fDay').value = task ? task.day : dateKey(new Date());
    document.getElementById('fTime').value = task ? (task.time || '') : '';
    document.getElementById('fStatus').value = task ? task.status : 'Do zrobienia';
    document.getElementById('fDesc').value = task ? (task.description || '') : '';

    urgencyVal = task ? task.urgency : 'Średnia';
    document.querySelectorAll('.urgency-opt').forEach(o=>o.classList.toggle('active', o.dataset.val===urgencyVal));

    overlay.classList.add('open');
    setTimeout(()=>document.getElementById('fTitle').focus(), 120);
  }
  function closeModal(){
    overlay.classList.remove('open');
    form.reset();
    editingId = null;
    urgencyVal = 'Średnia';
    document.querySelectorAll('.urgency-opt').forEach(o=>o.classList.toggle('active', o.dataset.val==='Średnia'));
  }

  document.getElementById('openAddTop').addEventListener('click', ()=>openModal());
  document.getElementById('openAddFab').addEventListener('click', ()=>openModal());
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelModal').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && overlay.classList.contains('open')) closeModal(); });

  document.getElementById('urgencySelect').addEventListener('click', (e)=>{
    const opt = e.target.closest('.urgency-opt');
    if(!opt) return;
    urgencyVal = opt.dataset.val;
    document.querySelectorAll('.urgency-opt').forEach(o=>o.classList.toggle('active', o===opt));
  });

  function showToast(msg){
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 2200);
  }

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const title = document.getElementById('fTitle').value.trim();
    const difficulty = document.getElementById('fDiff').value;
    const day = document.getElementById('fDay').value;
    const time = document.getElementById('fTime').value;
    const status = document.getElementById('fStatus').value;
    const description = document.getElementById('fDesc').value.trim();
    if(!title || !day) return;

    const tasks = loadTasks();
    if(editingId){
      const idx = tasks.findIndex(x=>x.id===editingId);
      if(idx !== -1){
        const prev = tasks[idx];
        // Reset the fired-reminder marker whenever day/time actually changed,
        // so an edited task can alert again.
        const notifiedAt = (prev.day===day && prev.time===time) ? prev.notifiedAt : null;
        tasks[idx] = { ...prev, title, difficulty, urgency: urgencyVal, day, time, status, description, notifiedAt };
      }
      saveTasks(tasks);
      closeModal();
      showToast('Zadanie zostało zaktualizowane');
    } else {
      tasks.push({ id: uid(), title, difficulty, urgency: urgencyVal, day, time, status, description, createdAt: Date.now(), notifiedAt: null });
      saveTasks(tasks);
      closeModal();
      showToast('Zadanie zostało dodane');
    }
    render();
  });

  // Live updates across tabs
  window.addEventListener('storage', (e)=>{
    if(e.key === STORAGE_KEY) render();
  });

  // Live clock
  const clockEl = document.getElementById('liveClock');
  function tickClock(){
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'});
  }

  // Notification permission (best-effort, silently ignored if unsupported/denied)
  if('Notification' in window && Notification.permission === 'default'){
    // Ask only once the user has actually created a task with a reminder time,
    // not on cold load — avoids an unsolicited permission prompt.
  }

  function beep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [0, 0.22, 0.44].forEach((t, i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = i === 2 ? 1046.5 : 880;
        gain.gain.setValueAtTime(0, now + t);
        gain.gain.linearRampToValueAtTime(0.22, now + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + t + 0.18);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + t);
        osc.stop(now + t + 0.2);
      });
    }catch(e){ /* audio unavailable — ignore */ }
  }

  function checkDueTasks(){
    const now = new Date();
    const todayKey = dateKey(now);
    const hhmm = now.toTimeString().slice(0,5);
    const tasks = loadTasks();
    let changed = false;
    tasks.forEach(t=>{
      if(!t.time || t.status === 'Zrobione') return;
      if(t.day !== todayKey) return;
      if(t.time !== hhmm) return;
      if(t.notifiedAt === todayKey + t.time) return; // already fired for this minute

      t.notifiedAt = todayKey + t.time;
      changed = true;
      beep();
      showToast(`⏰ „${t.title}" — czas na to zadanie`);
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification('Workflow — zadanie do zrobienia', { body: t.title, tag: t.id }); }catch(e){}
      }
      const card = document.querySelector(`.task[data-id="${t.id}"]`);
      if(card){ card.classList.add('is-firing'); setTimeout(()=>card.classList.remove('is-firing'), 3200); }
    });
    if(changed) saveTasks(tasks);
  }

  // Ask for notification permission the first time a reminder time is actually set
  document.getElementById('fTime').addEventListener('change', function(){
    if(this.value && 'Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission().catch(()=>{});
    }
  });

  tickClock();
  setInterval(tickClock, 15000);
  setInterval(checkDueTasks, 20000);
  checkDueTasks();

  // Weekday header (built once — always Mon–Sun regardless of viewed month)
  document.getElementById('weekdayRow').innerHTML = DAY_NAMES.map(n=>`<span>${n.slice(0,3)}</span>`).join('');

  // Month navigation
  document.getElementById('prevMonth').addEventListener('click', ()=>{
    viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    render();
  });
  document.getElementById('gotoToday').addEventListener('click', ()=>{
    viewYear = today.getFullYear(); viewMonth = today.getMonth();
    render();
  });

  render();
})();
</script>

</body>
